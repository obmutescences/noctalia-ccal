id = "noctalia/ccal"
name = "中国农历"
version = "1.0.0"
plugin_api = 3
author = "zerone"
license = "MIT"
dependencies = ["ccal"]
tags = ["calendar", "lunar", "chinese", "holiday"]
icon = "calendar"
description = "在 Noctalia 状态栏显示中国农历、节气和中国节假日调休信息。需要系统安装 ccal。"

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 15
max = 3600

[[setting]]
key = "fetch_holidays"
type = "bool"
label_key = "settings.fetch_holidays.label"
description_key = "settings.fetch_holidays.description"
default = true

[[setting]]
key = "events"
type = "string_list"
label_key = "settings.events.label"
description_key = "settings.events.description"
default = []

[[widget]]
id = "calendar"
entry = "calendar.luau"

  [[widget.setting]]
  key = "date_format"
  type = "string"
  label_key = "settings.date_format.label"
  description_key = "settings.date_format.description"
  default = "ddd MM月dd日 LL"

[[service]]
id = "ccal_service"
entry = "ccal_service.luau"

[[desktop_widget]]
id = "calendar_desktop"
entry = "desktop_widget.luau"

  [[desktop_widget.setting]]
  key = "show_solar_term"
  type = "bool"
  label_key = "settings.show_solar_term.label"
  description_key = "settings.show_solar_term.description"
  default = true

  [[desktop_widget.setting]]
  key = "highlight_holidays"
  type = "bool"
  label_key = "settings.highlight_holidays.label"
  description_key = "settings.highlight_holidays.description"
  default = true

[[panel]]
id = "calendar_panel"
entry = "panel.luau"
width = 560
height = 580
placement = "attached"
position = "auto"

  [[panel.setting]]
  key = "show_solar_term"
  type = "bool"
  label_key = "settings.show_solar_term.label"
  description_key = "settings.show_solar_term.description"
  default = true

  [[panel.setting]]
  key = "highlight_holidays"
  type = "bool"
  label_key = "settings.highlight_holidays.label"
  description_key = "settings.highlight_holidays.description"
  default = true
